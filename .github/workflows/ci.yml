name: ci

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Compile
        run: pnpm build

      - name: Lint and format check
        run: pnpm check

      - name: Docs check
        run: pnpm docs:check

      - name: Release metadata check
        run: pnpm release:check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24
                
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test

  compat-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build and verify compatibility shim
        run: |
          pnpm build
          ROOT_TARBALL="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          cd compat/agora-agent-server-sdk
          npm install --no-save "$RUNNER_TEMP/$ROOT_TARBALL"
          npm pack --dry-run
          node verify-compat.js
